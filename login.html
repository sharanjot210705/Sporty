<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Elite Sports | Registration Hub</title>
    <!-- Google Fonts: Sporty & Modern Mix -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0b1525 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* dynamic sporty background elements */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" opacity="0.08"><path fill="none" stroke="%23ffd966" stroke-width="2" d="M0,400 L1200,400 M200,0 L200,800 M400,0 L400,800 M600,0 L600,800 M800,0 L800,800 M1000,0 L1000,800 M0,200 L1200,200 M0,600 L1200,600"/><circle cx="600" cy="400" r="120" stroke="%23ffcc33" stroke-width="2.5" fill="none"/><path d="M600,280 L600,520 M480,400 L720,400 M540,320 L660,480 M660,320 L540,480" stroke="%23ffcc33" stroke-width="2"/><path d="M200,150 L280,220 M1000,650 L920,580" stroke="%23ffaa22" stroke-width="3"/><path d="M100,500 L180,570 M1100,300 L1020,230" stroke="%23ffaa22" stroke-width="3"/></svg>');
            background-repeat: repeat;
            background-size: 300px;
            pointer-events: none;
        }

        /* animated glow orbs */
        .bg-blur {
            position: fixed;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 50, 0.2) 0%, rgba(255, 80, 40, 0) 70%);
            top: -20vh;
            right: -20vw;
            filter: blur(80px);
            z-index: 0;
            animation: floatSlow 18s infinite alternate;
        }

        .bg-blur-two {
            bottom: -15vh;
            left: -15vw;
            top: auto;
            right: auto;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.2) 0%, rgba(0, 40, 80, 0) 70%);
            width: 70vmax;
            height: 70vmax;
            animation: floatSlow 22s infinite alternate-reverse;
        }

        @keyframes floatSlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            100% { transform: translate(5%, 8%) scale(1.2); opacity: 0.8; }
        }

        /* MAIN REGISTRATION CARD */
        #register {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
            padding: 2rem;
        }

        .form-box {
            background: rgba(8, 14, 26, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 36px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.2) inset, 0 0 20px rgba(255, 200, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s;
        }

        .form-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 215, 0, 0.5) inset, 0 0 28px rgba(255, 200, 0, 0.5);
        }

        /* sporty heading */
        .sport-head {
            text-align: center;
            margin-bottom: 28px;
        }

        .sport-head h2 {
            font-family: 'Orbitron', monospace;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #FFE55C, #FFB347, #FF8C42);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-bottom: 8px;
        }

        .sport-tag {
            display: inline-block;
            background: rgba(255, 200, 50, 0.2);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #FFD966;
            border: 1px solid rgba(255, 200, 100, 0.5);
        }

        .sport-tag i {
            margin-right: 6px;
        }

        /* form group modern */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #FFD966;
            font-size: 1.1rem;
            transition: all 0.2s;
            pointer-events: none;
        }

        .form-box input,
        .form-box textarea {
            width: 100%;
            padding: 14px 18px 14px 48px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            background: rgba(20, 28, 40, 0.9);
            border: 1.5px solid rgba(255, 215, 0, 0.3);
            border-radius: 60px;
            color: white;
            font-weight: 500;
            transition: all 0.25s;
            outline: none;
        }

        .form-box textarea {
            border-radius: 28px;
            resize: vertical;
            padding: 14px 18px 14px 48px;
            min-height: 85px;
        }

        .form-box input:focus,
        .form-box textarea:focus {
            border-color: #FFD966;
            box-shadow: 0 0 0 3px rgba(255, 217, 102, 0.3);
            background: rgba(12, 20, 32, 0.95);
        }

        /* password wrapper for toggle */
        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #FFD966;
            cursor: pointer;
            font-size: 1.1rem;
            z-index: 5;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: white;
        }

        /* strength meter */
        .strength-meter {
            margin-top: 6px;
            margin-left: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .strength-bar {
            height: 4px;
            width: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            transition: 0.2s;
        }

        .strength-text {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* action button */
        .enter-btn {
            margin-top: 20px;
            padding: 14px;
            width: 100%;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Orbitron', monospace;
            background: linear-gradient(95deg, #FFD966, #FFB347);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            color: #0a0f1a;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 1px;
            box-shadow: 0 6px 0 #b4621a;
            transform: translateY(-2px);
        }

        .enter-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .enter-btn i {
            font-size: 1.2rem;
        }

        /* error / success toasts */
        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #11171fcc;
            backdrop-filter: blur(16px);
            padding: 12px 24px;
            border-radius: 80px;
            font-weight: 600;
            border-left: 6px solid #FFD966;
            color: #FFE9B6;
            font-size: 0.9rem;
            z-index: 200;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* small link style */
        .legal-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.7rem;
            color: #bbb;
            border-top: 1px dashed rgba(255,215,0,0.3);
            padding-top: 18px;
        }

        .legal-note a {
            color: #FFD966;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .form-box {
                padding: 32px 24px;
            }
            .sport-head h2 {
                font-size: 2rem;
            }
            .toast-msg {
                white-space: normal;
                width: 90%;
                text-align: center;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur"></div>
    <div class="bg-blur-two"></div>

    <div id="register">
        <div class="form-box">
            <div class="sport-head">
                <h2><i class="fas fa-bolt"></i> SPORTS <span style="color:#FFD966;">ELITE</span></h2>
                <div class="sport-tag">
                    <i class="fas fa-futbol"></i> REGISTER · JOIN THE ARENA
                </div>
            </div>

            <!-- Registration Form (no actual page reload, smooth validation) -->
            <form id="registrationForm" action="#" method="post">
                <div class="input-group">
                    <i class="fas fa-user-athlete"></i>
                    <input type="text" id="fullName" placeholder="Full name *" autocomplete="name">
                </div>

                <div class="input-group">
                    <i class="fas fa-phone-alt"></i>
                    <input type="tel" id="phone" placeholder="Phone number *" autocomplete="tel">
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Gmail address *" autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Create Password *" autocomplete="new-password">
                        <button type="button" class="toggle-password" id="togglePwdBtn" aria-label="Show password">
                            <i class="far fa-eye-slash"></i>
                        </button>
                    </div>
                    <div class="strength-meter" id="strengthMeter">
                        <div class="strength-bar" id="strengthBar"></div>
                        <span class="strength-text" id="strengthText">强度</span>
                    </div>
                </div>

                <div class="input-group">
                    <i class="fas fa-comment-dots"></i>
                    <textarea id="sportsInterest" placeholder="Favorite sport / goals (optional)"></textarea>
                </div>

                <button type="submit" class="enter-btn" id="submitBtn">
                    <i class="fas fa-arrow-right-to-bracket"></i> LOGIN / REGISTER
                </button>
            </form>
            <div class="legal-note">
                <i class="fas fa-shield-alt"></i> Secure entry • By joining you agree to the arena rules
            </div>
        </div>
    </div>

    <!-- dynamic toast message -->
    <div id="liveToast" class="toast-msg">✨ Welcome champion</div>

    <script>
        (function() {
            // DOM elements
            const nameInput = document.getElementById('fullName');
            const phoneInput = document.getElementById('phone');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const sportsText = document.getElementById('sportsInterest');
            const submitBtn = document.getElementById('submitBtn');
            const toastEl = document.getElementById('liveToast');
            const toggleBtn = document.getElementById('togglePwdBtn');
            const strengthBar = document.getElementById('strengthBar');
            const strengthTextSpan = document.getElementById('strengthText');

            // Helper: show toast message
            let toastTimeout;
            function showMessage(text, isError = true) {
                if (toastTimeout) clearTimeout(toastTimeout);
                toastEl.textContent = text;
                toastEl.style.borderLeftColor = isError ? '#FF6666' : '#66FF99';
                if (!isError) toastEl.style.borderLeftColor = '#FFD966';
                toastEl.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2800);
            }

            // Password strength meter (real-time)
            function evaluatePasswordStrength(pwd) {
                if (!pwd) {
                    strengthBar.style.backgroundColor = 'rgba(255,255,255,0.2)';
                    strengthBar.style.width = '60px';
                    strengthTextSpan.textContent = '⚡ 输入密码';
                    strengthTextSpan.style.color = '#aaa';
                    return;
                }
                let strength = 0;
                if (pwd.length >= 6) strength++;
                if (pwd.length >= 10) strength++;
                if (/[A-Z]/.test(pwd)) strength++;
                if (/[0-9]/.test(pwd)) strength++;
                if (/[^A-Za-z0-9]/.test(pwd)) strength++;
                
                let score = Math.min(strength, 4);
                let widthPercent = 15 + (score * 18);
                let color = '#FF5555';
                let text = '脆弱';
                if (score === 1) { color = '#FF8855'; text = '弱'; widthPercent = 35; }
                if (score === 2) { color = '#FFC107'; text = '中等'; widthPercent = 55; }
                if (score === 3) { color = '#A5D6A5'; text = '强'; widthPercent = 75; }
                if (score >= 4) { color = '#6FCF97'; text = '非常强 💪'; widthPercent = 95; }
                strengthBar.style.backgroundColor = color;
                strengthBar.style.width = widthPercent + 'px';
                strengthTextSpan.textContent = text;
                strengthTextSpan.style.color = color;
            }

            passwordInput.addEventListener('input', function() {
                evaluatePasswordStrength(passwordInput.value);
            });

            // Toggle password visibility
            let passwordVisible = false;
            toggleBtn.addEventListener('click', function() {
                passwordVisible = !passwordVisible;
                passwordInput.type = passwordVisible ? 'text' : 'password';
                const icon = toggleBtn.querySelector('i');
                if (passwordVisible) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                } else {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            });

            // Validation functions
            function validateName(name) {
                if (!name.trim()) return 'Full name is required';
                if (name.trim().length < 2) return 'Name must be at least 2 characters';
                if (!/^[A-Za-zÀ-ÖØ-öø-ÿ\s'-]+$/.test(name.trim())) return 'Name should contain only letters, spaces, apostrophes';
                return '';
            }

            function validatePhone(phone) {
                const raw = phone.trim();
                if (!raw) return 'Phone number is required';
                const phoneRegex = /^[+]?[(]?[0-9]{1,4}[)]?[-\s.]?[(]?[0-9]{1,4}[)]?[-\s.]?[0-9]{3,4}[-\s.]?[0-9]{3,9}$/im;
                // allow international format, but at least digits count > 6
                const digitsOnly = raw.replace(/\D/g, '');
                if (digitsOnly.length < 7 || digitsOnly.length > 15) return 'Phone number must have 7-15 digits';
                if (!phoneRegex.test(raw) && digitsOnly.length < 7) return 'Enter a valid phone number';
                return '';
            }

            function validateEmail(email) {
                const em = email.trim();
                if (!em) return 'Gmail address is required';
                // allow gmail or any professional email but must be valid
                const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                if (!emailRegex.test(em)) return 'Enter a valid email (e.g., name@domain.com)';
                // optional Gmail tip but no strict restriction
                return '';
            }

            function validatePassword(pwd) {
                if (!pwd) return 'Password is required';
                if (pwd.length < 6) return 'Password must be at least 6 characters';
                let strong = false;
                if (pwd.length >= 6) strong = true;
                // additional security suggestion but not blocking
                return '';
            }

            // Final form handler
            function handleRegistration(event) {
                event.preventDefault();

                // get values
                const nameVal = nameInput.value;
                const phoneVal = phoneInput.value;
                const emailVal = emailInput.value;
                const passwordVal = passwordInput.value;
                const sportsVal = sportsText.value.trim();

                let errorList = [];

                const nameError = validateName(nameVal);
                if (nameError) errorList.push(nameError);

                const phoneError = validatePhone(phoneVal);
                if (phoneError) errorList.push(phoneError);

                const emailError = validateEmail(emailVal);
                if (emailError) errorList.push(emailError);

                const pwdError = validatePassword(passwordVal);
                if (pwdError) errorList.push(pwdError);

                if (errorList.length > 0) {
                    // show first error as toast
                    showMessage(`⚠️ ${errorList[0]}`, true);
                    return;
                }

                // SUCCESS: store minimal user data in localStorage (simulate login)
                const userProfile = {
                    fullName: nameVal.trim(),
                    phone: phoneVal.trim(),
                    email: emailVal.trim(),
                    sportsInterest: sportsVal || "⚡ Future athlete",
                    registeredAt: new Date().toISOString()
                };
                localStorage.setItem('sportsEliteUser', JSON.stringify(userProfile));
                
                // show success toast and redirect after short delay to "sports.html"
                showMessage(`🏆 Welcome ${nameVal.trim().split(' ')[0]}! Entering the arena...`, false);
                
                // simulate redirect to sports.html (but we create a smooth transition, also preserves style)
                // According to requirement: href="sports.html" but we want to handle modern navigation.
                // Instead of simply linking, we can redirect after success. 
                // If sports.html does not exist in demo, we create an artificial success page fallback? 
                // We'll redirect to "sports.html" but also provide fallback alert if not exists? Better to create dynamic internal dashboard.
                // But original had <a href="sports.html"> with button. Now we fully validate then redirect.
                setTimeout(() => {
                    // attempt to navigate to sports.html
                    window.location.href = "sports.html";
                }, 1000);
                
                // fallback if after 1.8s still here? no problem.
            }

            // Attach event to form
            const regForm = document.getElementById('registrationForm');
            regForm.addEventListener('submit', handleRegistration);

            // also additional realtime inline hint (optional remove on submit)
            // Set default strength meter init
            evaluatePasswordStrength('');
            
            // add extra interactive live validation on blur (gentle)
            const highlightField = (input, isValid) => {
                if (isValid) {
                    input.style.borderColor = "rgba(100, 255, 150, 0.7)";
                } else {
                    input.style.borderColor = "rgba(255, 100, 100, 0.7)";
                }
                setTimeout(() => {
                    if (document.activeElement !== input) {
                        input.style.borderColor = "rgba(255, 215, 0, 0.3)";
                    }
                }, 1500);
            };

            nameInput.addEventListener('blur', () => {
                const err = validateName(nameInput.value);
                highlightField(nameInput, err === '');
                if (err) showMessage(err, true);
            });
            phoneInput.addEventListener('blur', () => {
                const err = validatePhone(phoneInput.value);
                highlightField(phoneInput, err === '');
                if (err) showMessage(err, true);
            });
            emailInput.addEventListener('blur', () => {
                const err = validateEmail(emailInput.value);
                highlightField(emailInput, err === '');
                if (err) showMessage(err, true);
            });
            passwordInput.addEventListener('blur', () => {
                const err = validatePassword(passwordInput.value);
                highlightField(passwordInput, err === '');
                if (err) showMessage(err, true);
            });
            
            // Remove any initial leftover default anchor behavior
            const anyAnchor = document.querySelector('a');
            if (anyAnchor && anyAnchor.getAttribute('href') === 'sports.html') {
                // but we override everything with form logic, no extra anchor click needed
            }
            // ensure button inside form is used
            submitBtn.type = 'submit';
        })();
    </script>
</body>
</html>
